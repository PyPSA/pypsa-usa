# Machine-readable waivers for the equivalence harness (spec D8).
# Each entry suppresses exactly one signed-off delta and MUST reference a row
# in docs/superpowers/specs/2026-08-07-deltas-ledger.md.
#
# There are TWO kinds of entry here and an entry is one or the other, never
# both:
#
#   CELL waiver   stage, component, column, kind ('*' wildcards allowed).
#                 Suppresses a stage-by-stage finding in compare.py.
#   TABLE waiver  metric, key (optionally family). Explains one row of
#                 tables.comparison_table, turning UNEXPLAINED into explained.
#
# Each kind ignores the other's fields, and `compare.is_waived` SKIPS any entry
# that names metric/key/family: its four cell fields are absent, and absent
# means "any", so a table waiver read as a cell waiver would silence every
# finding in the run.
#
# Both kinds take `ledger:` (required), `reason:`, the optional `hotfix:`, and
# the optional scope fields `interconnect:` and `prong:` — a scope field that is
# set must match the run, so a waiver measured on one leg cannot sign off
# another.
#
# EITHER kind may also BOUND the difference it explains. A bound is a claim
# about a measured quantity, so a waiver that carries one only holds while the
# difference stays inside it.
#
#   TABLE waivers (checked by tables._bounds_violation, against the row's delta)
#     expect_sign        '+' or '-', the sign of (develop - master).
#     max_abs_pct        upper bound on |delta %|.
#     max_abs_delta_mw   upper bound on |delta| in the metric's own unit. Use it
#                        instead of max_abs_pct when master's side of the row is
#                        0 (or so small the percentage is noise): |delta %| is
#                        then undefined and max_abs_pct always fires, while the
#                        MW that was actually measured is still a real bound.
#
#   CELL waivers (checked by compare._cell_bounds_violation, against the
#   finding's `detail`; for system_available_mw-style findings)
#     expect_sign        '+' or '-', the sign of the ANNUAL TOTAL delta
#                        (develop_total_mwh - master_total_mwh).
#     max_total_pct      upper bound on |annual total delta| as % of master.
#     max_mean_rel_pct   upper bound on the finding's mean_rel_pct.
#
# `worst_rel_pct` is deliberately not boundable: at dawn and dusk master's
# available power is a few MW, so a fraction of a MW is a 100 % relative error.
# The energy-weighted mean relative error (sum|delta| / sum master) is recorded
# in the finding detail instead.
#
# Without bounds a waiver is unbounded in sign and magnitude: the HF-24 entry
# written for "+2,158 MW of potential master silently dropped" (+1.1 %) would
# equally explain a -50 % row or a 10,000x one. A row outside the bounds is
# reported as `waiver HF-n bounds violated (sign|magnitude)` and stays
# UNEXPLAINED; a finding outside them stays LIVE with a `waiver_note` naming
# the bound that failed. `max_abs_pct` also refuses an undefined delta %
# (master 0, develop non-zero), and a cell bound refuses a finding that does
# not carry the totals it needs: the bound cannot be shown to hold.
#
# `hotfix: HF-<n>` names the row in tests/equivalence/hotfixes.yaml — the
# machine-readable extract of memory/plans/hotfix-ledger.md — that CAUSES the
# waived delta. `ledger:` says the delta was signed off; `hotfix:` says which
# change on develop produces it, so a waiver and a comparison-table row that
# describe the same difference can be recognised as one thing. Optional because
# several deltas predate both branches and belong to no hot-fix.
