# The system potential itself, sum(p_nom_max). The finding's detail carries
# `develop`, `master` and `rel_pct`, so the bounds that read it are
# `expect_sign` (the sign of develop - master) and `max_abs_pct` (|rel_pct|) —
# NOT the three annual-energy bounds above, which read fields this finding does
# not have and which the well-formedness test therefore refuses here. HF-24
# only ever ADDS potential on develop, and the measured western deltas
# (western-p2-3h-20260915-1449) are +0.2057 % (onwind, 265,920 vs 265,374 MW)
# and +0.1404 % (solar, 1,830,708 vs 1,828,141 MW); 0.5 % leaves headroom
# without admitting a sign flip or a percent-scale move.
- interconnect: western
  prong: 2
  stage: profile_onwind
  component: system_potential_mw
  column: sum(p_nom_max)
  kind: value
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  max_abs_pct: 0.5
  reason: master drops NREL caps for substations with zero GODEEEP availability or no intersecting cell; develop retains them (HF-24)
- interconnect: western
  prong: 2
  stage: profile_solar
  component: system_potential_mw
  column: sum(p_nom_max)
  kind: value
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  max_abs_pct: 0.5
  reason: master drops NREL caps for substations with zero GODEEEP availability or no intersecting cell; develop retains them (HF-24)
# The develop-only cluster itself. After the prong-2 rollup master has 18 onwind
# / 19 solar clusters and develop 19 / 20: `p87 0` (96 MW onwind, 2,158 MW
# solar) is HF-24's bus 37808, which master dropped entirely. Reported once,
# here, instead of leaking into every pooled quantile row - the pooled profile
# metrics are computed over the common clusters only.
#
# Bounded on the two things this finding actually measures. `expect_side:
# develop` is the whole direction of HF-24: master DROPS capacity, so a cluster
# may exist on develop alone and never on master alone - a master-only cluster
# is capacity develop lost, the opposite phenomenon, and stays live.
# `max_one_sided_mw: 3000` is the sum over both one-sided lists; measured 96 MW
# (onwind) and 2,158 MW (solar) on western-p2-3h-20260915-1449. Unbounded, these two entries waived any
# one-sided cluster set whatever: 50 GW appearing on develop, or capacity
# vanishing on master, read exactly the same to the matcher.
- interconnect: western
  prong: 2
  stage: profile_onwind
  component: cluster_set
  column: <index>
  kind: row_set
  ledger: DL-18
  hotfix: HF-24
  expect_side: develop
  max_one_sided_mw: 3000
  reason: develop-only cluster p87 0 (96 MW onwind) is HF-24's retained NREL caps capacity at bus 37808; master has no such cluster
- interconnect: western
  prong: 2
  stage: profile_solar
  component: cluster_set
  column: <index>
  kind: row_set
  ledger: DL-18
  hotfix: HF-24
  expect_side: develop
  max_one_sided_mw: 3000
  reason: develop-only cluster p87 0 (2,158 MW solar) is HF-24's retained NREL caps capacity at bus 37808; master has no such cluster
# The hourly national available power, sum_bus(profile * p_nom_max). HF-24's
# retained capacity (450 MW onwind, 2,566 MW solar at the clusters' own CF)
# lifts develop above master in EVERY hour the resource is producing, which is
# what the {onwind,solar}_national_available_power figures show: a flat
# +0.15...+0.3 % band all year, never a crossing. Measured on
# western-p2-3h-20260915-1429 (2026-09-15):
#   onwind  8371/8760 h mismatched, mean_rel 0.386 %, annual +0.25 %
#           (622,371,840 vs 620,823,223 MWh)
#   solar   4208/8760 h mismatched, mean_rel 0.984 %, annual +0.14 %
#           (4,513,095,168 vs 4,506,760,381 MWh)
# Bounded, because this is the finding that would CATCH a real capacity-factor
# construction difference: the annual total must move in HF-24's direction
# (expect_sign '+') and by no more than 0.5 %, and the per-hour mean relative
# error by no more than 1.5 %. `worst_rel_pct` (32 % onwind, 100 % solar) is
# NOT bounded: at dawn and dusk master's available power is a few MW, so a
# fraction of a MW is a 100 % relative error and the number means nothing. The
# energy-weighted mean relative error is recorded in the finding's detail
# instead. A sign flip, a bigger annual move, or a mean relative error over
# 1.5 % takes the finding straight back to live.
- interconnect: western
  prong: 2
  stage: profile_onwind
  component: system_available_mw
  column: sum_bus(profile*p_nom_max)
  kind: value
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  max_total_pct: 0.5
  max_mean_rel_pct: 1.5
  reason: HF-24's retained onwind capacity (450 MW) raises develop's available power in every producing hour; annual +0.25 %, mean hourly 0.39 %
- interconnect: western
  prong: 2
  stage: profile_solar
  component: system_available_mw
  column: sum_bus(profile*p_nom_max)
  kind: value
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  max_total_pct: 0.5
  max_mean_rel_pct: 1.5
  reason: HF-24's retained solar capacity (2,566 MW) raises develop's available power in every daylight hour; annual +0.14 %, mean hourly 0.98 %
