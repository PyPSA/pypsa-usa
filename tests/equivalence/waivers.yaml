# Measured on the western leg (smoke-western-20260915-1141, 2026-09-15): 7
# onwind buses / 546 MW and 4 solar buses / 2,566 MW, bus 37808 being the whole
# of cluster p87's solar. Develop's potential is therefore HIGHER, which is the
# sign of the fix (expect_sign: '+'), and the measured rows are +0.19 % to
