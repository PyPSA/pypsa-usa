# --- DL-18 / HF-24: the NREL caps p_nom_max master drops with the substation.
#
# The bound is COMPUTED per row by tests/equivalence/reconstructions.py
# (hf24_nrel_caps_drop), not measured by hand. Master's build_renewable_profiles
# filters on `ds["profile"].mean("time") > min_p_max_pu`, and a substation whose
# summed GODEEEP land availability is zero has a NaN CF, so `NaN > 0` is False
# and the whole bus leaves the file -- taking its NREL caps `p_nom_max` with it,
# which was never zero. Develop sums the caps per s{simpl} cluster BEFORE that
# filter (remap_caps_to_cluster), so the MW survives on a cluster whose CF is
# defined. Per (zone, tech) the reconstruction rebuilds the caps of every
# in-footprint substation of the common clusters (predicting develop) and the
# part master kept (predicting master), and requires their difference to equal
# develop - master within the row's own tolerance.
#
# This REPLACES four hand-measured `max_abs_pct: 5` rows scoped
# `interconnect: western, prong: 2` (p_nom_max_by_zone_onwind p8/p9/p10 and
# p_nom_max_by_zone_solar p8). They are deleted rather than kept beside the
# reconstruction: keeping both would let the weaker percentage bound explain a
# row exactly when the reconstruction refuses it. They also did not scale --
# the whole-USA leg has 46 onwind + 4 solar rows over tolerance, and `p128 |
# onwind` moves 126 -> 174 MW (+38 %) on one substation's 48 MW, which no
# percentage bound written for western would have covered.
#
# Unscoped by interconnect on purpose: the reconstruction is the scope. Neither
# entry names a `key`, so each covers every zone of its metric -- safe, because
# a zone the reconstruction has no row for resolves to `lookup() is None` and
# stays UNEXPLAINED.
#
# The HF-24 CELL waivers below (system_potential_mw, system_available_mw,
# cluster_set) are untouched: they are compare.py findings, not table rows, and
# this reconstruction has nothing to say about them.
- metric: p_nom_max_by_zone_onwind
  reconstruction: hf24_nrel_caps_drop
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  reason: master drops the NREL caps p_nom_max of substations with zero GODEEEP land availability; the dropped MW is reconstructed per zone and must equal develop - master
- metric: p_nom_max_by_zone_solar
  reconstruction: hf24_nrel_caps_drop
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  reason: as above, for solar
# The system potential itself, sum(p_nom_max). The finding's detail carries
# `develop`, `master` and `rel_pct`, so the bounds that read it are
# `expect_sign` (the sign of develop - master) and `max_abs_pct` (|rel_pct|) —
# NOT the three annual-energy bounds above, which read fields this finding does
# not have and which the well-formedness test therefore refuses here. HF-24
# only ever ADDS potential on develop, and the measured western deltas
# (western-p2-3h-20260915-1449) are +0.2057 % (onwind, 265,920 vs 265,374 MW)
# and +0.1404 % (solar, 1,830,708 vs 1,828,141 MW); 0.5 % leaves headroom
# without admitting a sign flip or a percent-scale move.
- interconnect: western
  prong: 2
  stage: profile_onwind
  component: system_potential_mw
  column: sum(p_nom_max)
  kind: value
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  max_abs_pct: 0.5
  reason: master drops NREL caps for substations with zero GODEEEP availability or no intersecting cell; develop retains them (HF-24)
- interconnect: western
  prong: 2
  stage: profile_solar
  component: system_potential_mw
  column: sum(p_nom_max)
  kind: value
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  max_abs_pct: 0.5
  reason: master drops NREL caps for substations with zero GODEEEP availability or no intersecting cell; develop retains them (HF-24)
# The develop-only cluster itself. After the prong-2 rollup master has 18 onwind
# / 19 solar clusters and develop 19 / 20: `p87 0` (96 MW onwind, 2,158 MW
# solar) is HF-24's bus 37808, which master dropped entirely. Reported once,
# here, instead of leaking into every pooled quantile row - the pooled profile
# metrics are computed over the common clusters only.
#
# Bounded on the two things this finding actually measures. `expect_side:
# develop` is the whole direction of HF-24: master DROPS capacity, so a cluster
# may exist on develop alone and never on master alone - a master-only cluster
# is capacity develop lost, the opposite phenomenon, and stays live.
# `max_one_sided_mw: 3000` is the sum over both one-sided lists; measured 96 MW
# (onwind) and 2,158 MW (solar) on western-p2-3h-20260915-1449. Unbounded, these two entries waived any
# one-sided cluster set whatever: 50 GW appearing on develop, or capacity
# vanishing on master, read exactly the same to the matcher.
- interconnect: western
  prong: 2
  stage: profile_onwind
  component: cluster_set
  column: <index>
  kind: row_set
  ledger: DL-18
  hotfix: HF-24
  expect_side: develop
  max_one_sided_mw: 3000
  reason: develop-only cluster p87 0 (96 MW onwind) is HF-24's retained NREL caps capacity at bus 37808; master has no such cluster
- interconnect: western
  prong: 2
  stage: profile_solar
  component: cluster_set
  column: <index>
  kind: row_set
  ledger: DL-18
  hotfix: HF-24
  expect_side: develop
  max_one_sided_mw: 3000
  reason: develop-only cluster p87 0 (2,158 MW solar) is HF-24's retained NREL caps capacity at bus 37808; master has no such cluster
# The hourly national available power, sum_bus(profile * p_nom_max). HF-24's
# retained capacity (450 MW onwind, 2,566 MW solar at the clusters' own CF)
# lifts develop above master in EVERY hour the resource is producing, which is
# what the {onwind,solar}_national_available_power figures show: a flat
# +0.15...+0.3 % band all year, never a crossing. Measured on
# western-p2-3h-20260915-1429 (2026-09-15):
#   onwind  8371/8760 h mismatched, mean_rel 0.386 %, annual +0.25 %
#           (622,371,840 vs 620,823,223 MWh)
#   solar   4208/8760 h mismatched, mean_rel 0.984 %, annual +0.14 %
#           (4,513,095,168 vs 4,506,760,381 MWh)
# Bounded, because this is the finding that would CATCH a real capacity-factor
# construction difference: the annual total must move in HF-24's direction
# (expect_sign '+') and by no more than 0.5 %, and the per-hour mean relative
# error by no more than 1.5 %. `worst_rel_pct` (32 % onwind, 100 % solar) is
# NOT bounded: at dawn and dusk master's available power is a few MW, so a
# fraction of a MW is a 100 % relative error and the number means nothing. The
# energy-weighted mean relative error is recorded in the finding's detail
# instead. A sign flip, a bigger annual move, or a mean relative error over
# 1.5 % takes the finding straight back to live.
- interconnect: western
  prong: 2
  stage: profile_onwind
  component: system_available_mw
  column: sum_bus(profile*p_nom_max)
  kind: value
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  max_total_pct: 0.5
  max_mean_rel_pct: 1.5
  reason: HF-24's retained onwind capacity (450 MW) raises develop's available power in every producing hour; annual +0.25 %, mean hourly 0.39 %
- interconnect: western
  prong: 2
  stage: profile_solar
  component: system_available_mw
  column: sum_bus(profile*p_nom_max)
  kind: value
  ledger: DL-18
  hotfix: HF-24
  expect_sign: '+'
  max_total_pct: 0.5
  max_mean_rel_pct: 1.5
  reason: HF-24's retained solar capacity (2,566 MW) raises develop's available power in every daylight hour; annual +0.14 %, mean hourly 0.98 %
# --- HF-26: existing renewable capacity master drops at attach.
#
# The bound is COMPUTED per row by tests/equivalence/reconstructions.py
# (hf26_existing_renewable_drop), not measured by hand: for each (zone, carrier)
# it rebuilds the existing fleet from the plant table, assigns it to master's
# nodal substations, and predicts develop - master = the MW at substations
# master's profile file does not cover. A row is explained only when the
# prediction matches its delta within the row's own tolerance AND the
# reconstruction reproduces BOTH sides (gates G1/G2). Unscoped by interconnect
# on purpose: the reconstruction is the scope, and it is the only thing that can
# bound the USA rows where master is ~0 MW and |delta %| is 28,620.
#
# This REPLACES six hand-measured `max_abs_pct` rows (capacity_existing_by_carrier
# onwind/solar, p_nom_existing_by_zone_carrier p10|p9 x onwind|solar, all scoped
# `interconnect: western, prong: 2`). They are deleted rather than kept beside
# the reconstruction: keeping both would let a row be explained by the weaker
# percentage bound exactly when the reconstruction disagrees with it, which is a
# silent downgrade of the stronger test. They were also already incomplete --
# `p11 | solar` (189.4 vs 239.9 MW) was never measured, so it was never waived.
#
# Neither entry names a `key`, so each covers every key of its metric. That is
# safe because a key the reconstruction has no row for (`CCGT`, a storage
# carrier) resolves to `lookup() is None`, which `_bounds_violation` refuses as
# "reconstruction unavailable".
#
# HF-27 (DL-21), the per-zone RELOCATION of existing capacity, used to be waived
# alongside HF-26. It is not any more: it was a develop regression (plants
# matched to cluster centroids after simplify-early), it is fixed, and its rows
# must now come back equivalent. The reconstruction subsumes the detector for
# free -- a relocation makes the reconstructed fleet disagree with develop's row,
# and the row stays UNEXPLAINED with the relocated MW as its residual.
- metric: p_nom_existing_by_zone_carrier
  reconstruction: hf26_existing_renewable_drop
  ledger: DL-20
  hotfix: HF-26
  expect_sign: '+'
  reason: master drops existing renewable plants at substations with no profile generator; the dropped MW is reconstructed per zone and must equal develop - master
- metric: capacity_existing_by_carrier
  reconstruction: hf26_existing_renewable_drop
  ledger: DL-20
  hotfix: HF-26
  expect_sign: '+'
  reason: the national sum of the same reconstruction
# The three HF-27 waivers that stood here (p11 | solar, p8 | onwind,
# p8 | solar) were REMOVED when the zone misassignment was fixed on develop
# (add_electricity now matches plants to substations and maps through
# busmap_s{simpl}). They waived a DEVELOP regression, not a master defect: the
# reconstruction reproduces master's zone for 841 of 841 western plants, so
# those rows must come back equivalent. If one of them differs again, it is a
# finding — hence HF-27 is `usa_noop: true` in hotfixes.yaml and can no longer
# explain anything.
