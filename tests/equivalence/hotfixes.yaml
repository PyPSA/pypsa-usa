- id: HF-29
  commit: 02e1b59
  pr: null
  title: "District of Columbia demand is folded into Maryland before disaggregation, so a demand table that has a DC column stops losing it in silence"
  confidence: none
  ported: true
  ported_sha: 752099a
  usa_noop: true
  expect: [demand_by_zone/*]
  notes: >-
    No bus can carry a District of Columbia key on either branch: ReEDS files DC
    inside zone p123 with `st = MD`, and the DC buses' geographic `state`
    resolves to Maryland (develop) or northern Virginia (master, via the HF-5
    clobber). A demand column named `District of Columbia` therefore hit the
    silent drop in `_disaggregate_demand_to_buses`. `DEMAND_KEY_FOLDS` in
    build_demand.py now folds it into Maryland before the split, with a
    logger.info naming the MW, and any demand column with no bus under the
    current key is logged with the MW it drops.
    `usa_noop: true` AND `confidence: none` ARE MEASURED, NOT ASSUMED: the NREL
    EFS load profiles this benchmark reads
    (data/nrel_efs/EFSLoadProfile_{High_Rapid,Reference_Moderate}.csv) contain 48
    state codes and NO DC row (checked 2026-09-17), and the resolved zonal table
    for the usa leg has 48 columns. On this config the fold is a GUARD and moves
    nothing; the whole of the pre-fix over-allocation is HF-28's unnormalised
    LAF. It bites for readers whose source does carry DC (EULP per-state files,
    EER, SERVM).
    CONSEQUENCE WORTH SAYING OUT LOUD: after HF-28 lands, DC's real electricity
    demand is ABSENT from the model on both branches -- before the fix it was
    accidentally present, but as a far larger phantom (+8,763 MW billed to
    Maryland on develop, +5,656 MW to Virginia and +5,115 MW to Maryland on
    master). Giving DC its own key end to end is the real fix and is still open.
    Ported to master-benchmark as 5f88d66, so both sides fold identically.
    Backlog B7 / issue #3. Prose home: memory/plans/hotfix-ledger.md.
