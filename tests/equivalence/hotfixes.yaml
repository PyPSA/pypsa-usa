# Hot-fix registry — the machine-readable extract of the ledger.
#
# PROSE HOME: `memory/plans/hotfix-ledger.md` in the project brain. That file is
# authoritative; this one is its transcription, kept to the fields a program
# needs. Change the ledger first, then this file.
#
# A hot-fix is a change on `develop` that is NOT part of the core restructuring
# of the snakemake workflow — a data fix, a bug fix, a changed default — and
# that could by itself move a benchmark number. This registry is the set of
# candidate explanations for a master-vs-develop difference.
#
# Fields
#   id          HF-<n>, bare (never zero-padded); the ledger's '#' column.
#   commit      ledger 'commit' (7- or 40-char sha). Rows spanning several
#               commits carry the first; the rest go in `notes`.
#   pr          ledger 'PR' as an integer, or null for a harness-branch change
#               that never had one.
#   title       ledger 'what changed', one line.
#   confidence  ledger 'conf.': high | medium | low | none. Confidence that it
#               changes results ON A BENCHMARK RUN, not that the code is right.
#   ported      true once the fix is on `master-benchmark`, i.e. BOTH sides run
#               it. A ported row is a NEUTRALISED difference and is therefore
#               NOT a valid explanation for a residual difference — if one
#               traces to a ported row, the port is broken and that is a
#               finding. `tables.comparison_table` rejects ported ids.
#   ported_sha  the master-benchmark commit that carries it (ported rows only).
#   usa_noop    true when the row does nothing at all under the standing
#               whole-USA config (`interconnect: usa`, `model_topology.include:
#               {}`, `unit_commitment: false`). Do not chase these whatever
#               their confidence.
#   expect      optional: globs naming the comparison-table metrics this row
#               can move. Matched against the metric name and against
#               `<metric>/<key>` (tables.KNOWN_METRICS lists them). A bare
#               tolerance family is deliberately not a match: a row that
#               claims a whole family explains every difference in it.
#   master /    optional: the concrete value on each side, for rows that are a
#   develop     live code difference. Copied into run_meta.json's
#               `known_code_differences`.
#   notes       optional free text.

