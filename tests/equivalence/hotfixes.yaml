- id: HF-28
  commit: 01f742f
  pr: null
  title: "demand disaggregation key: master splits EFS state demand over NODAL buses keyed on `buses.state`, develop over s{simpl} buses keyed on `buses.reeds_state`; the LAF both sides consume was normalised over a THIRD column (`full_state`), so neither conserved state demand until the renormalisation landed"
  confidence: high
  ported: false
  usa_noop: false
  expect: [demand_by_zone/*, dispatch_by_carrier/*, capacity_opt_by_carrier/*, objective]
  master: >-
    `WriteStrategy._get_state_zones` returns `n.buses.state` and the split runs
    on the 82,549 NODAL buses. `state` is the geographic/power-region column
    written by `build_base_network`
  develop: >-
    `_get_state_zones` returns `n.buses.reeds_state.map(CODE_2_STATE)` and the
    split runs on the 300 `s{simpl}` cluster buses, because
    `aggregate_to_substations` drops `state` when `topological_boundaries:
    reeds_zone`. The two columns disagree on 547 nodal buses (LAF mass 0.582) --
    Oregon/Washington, Missouri/Kansas, New Hampshire/Massachusetts and the
    17 downtown-DC buses
  notes: >-
    TWO HALVES, AND ONLY ONE OF THEM IS PORTED.
    (1) NON-CONSERVATION -- FIXED ON BOTH BRANCHES. `LAF_state` is normalised in
    `build_base_network` over `full_state`, which neither consumption key
    reproduces, so `sum(laf)` inside a demand key was not 1: 20 of 48 states on
    master (Maryland 1.588, Virginia 1.409), 38 of 48 on develop (Maryland
    2.008). Allocated demand exceeded the EFS state totals by +2.28 % (master)
    and +1.85 % (develop); measured on usa s300, 2026-09-15, 470,193.2 vs
    461,636.2 MW mean. `dissagregate_demand` now renormalises the factors within
    the consumption key on develop (02e1b59) and on master-benchmark
    (5f88d66), so each key is conserved exactly whatever the key is. THIS HALF
    IS NEUTRALISED and cannot explain a residual difference.
    (2) THE KEY COLUMN ITSELF -- NOT PORTED, hence `ported: false`. After the
    renormalisation a bus still draws from the state its key names, so the 547
    buses where `state != reeds_state` still move demand between zones. Expect a
    residual, DIFFUSE `demand_by_zone` signature (43 zones on the pre-fix usa
    run, sum|delta| 3,009 MW, national 0 after the fix) that HF-28 legitimately
    explains. The CONCENTRATED p99/p123 signature is HF-5, not this row.
    BOTH LEGS MUST BE REBUILT: the fix moves both sides by ~2 %, so no pre-fix
    artifact may be compared against a post-fix one.
    The key choice arrives with the simplify-early stack (01f742f, the `commit` above); 02e1b59 is
    the fix commit, not the origin. Checker:
    tests/equivalence/diagnostics/demand_conservation.py reproduces the pre-fix
    baseline exactly. Backlog B7 / issue #3. Prose home:
    memory/plans/hotfix-ledger.md.
