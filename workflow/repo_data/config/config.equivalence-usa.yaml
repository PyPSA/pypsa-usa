# PyPSA-USA equivalence-harness config — WHOLE-US variant (full chain through
# solve_network, prong 2 at simpl=300). Derived from config.equivalence.yaml;
# differs in footprint (interconnect usa, no reeds_state include filter),
# granularity, and the national 1 Mt CO2 cap. (see
# docs/superpowers/specs/2026-08-07-pipeline-equivalence-and-perf-design.md).
# One shared file drives BOTH the develop side and the master-benchmark
# (baseline) side. The harness driver passes
# explicit target paths, so scenario lists here document the run shape;
# wildcards are taken from the targets. DO NOT use as a user-facing entry.
#
# Keys MASTER requires from the main config (its layered common lacks
# them): co2.storage, clustering.cluster_network.feature,
# clustering.simplify_network.feature (prong 2). develop ignores the extras.
#
# DELIBERATELY NOT A SPARSE OVERLAY. Unlike config.tutorial.yaml and
# config.test.yaml, this file must stay self-contained: the master checkout
# does NOT auto-load config.default.yaml, so any key dropped here would be
# supplied to develop and missing on master.
run:
  name: "equivalence"
  disable_progressbar: true
  shared_resources: false
  shared_cutouts: true
  validation: false

foresight: 'perfect'

# --- Pinned identically on BOTH sides (harness plan "What 'the same config'
# --- means", decision 2 of 2026-09-14; see memory/plans/harness-master-vs-develop.md).
# Newest PUDL release referenced anywhere on develop. Master's loaded
# config.common.yaml says v2025.2.0 and develop's says v2026.8.0; snakemake
# applies --configfile AFTER every configfile: directive, so pinning it here
# wins on both branches and HF-1's pudl_path half stops being a difference.
pudl_path: s3://pudl.catalyst.coop/v2026.8.0

scenario:
  interconnect: [usa]
  clusters: [134]           # plain = conventional-only aggregation (renewable zones kept), user choice 2026-09-06; reeds transport model: must equal the US ReEDS zone count (134 country==USA rows in ReEDS_Constraints/membership.csv)
  simpl: ['300']           # prong 2 production-style granularity (user choice 2026-08-31); prong 1 would use '' pass-through
  opts: [REM-3h, 3h]       # REM-3h = national 1 Mt CO2 cap (see regional_Co2_limits below); 3h = unconstrained twin
  ll: [v1.0]
  scope: "total"
  sector: ""
  planning_horizons: [2030]

model_topology:
  transmission_network: 'reeds'
  topological_boundaries: 'reeds_zone'
  interface_transmission_limits: false
  include: {}
  aggregate: {}

enable:
  build_cutout: false

# Historical 2012 GODEEEP CFs (user decision 2026-09-01): 2012 is the only
# historical year PUBLISHED on Zenodo, so both sides can retrieve identical
# bytes. Scenario/year/hub height are pinned HERE because each branch would
# otherwise inherit them from a DIFFERENT file (develop: the auto-loaded
# repo_data/config/config.{common,default}.yaml; master: its own layered
# config.common.yaml) — currently equal, but nothing keeps them so.
renewable_scenarios: ["historical"]
renewable_weather_years: [2012]     # CF year for historical scenarios (resolve_weather_year)
godeeep_wind_height: "_125m"

# Full CF-extraction window. 2012 is a leap year: fix_godeeep_time shifts the
# raw GODEEEP time axis past Feb 29, and get_renewable_snapshots drops Feb 29
# from the selection window (harness ledger DL-17; ported onto the baseline as a
# commit on master-benchmark), yielding the standard 8760-hour year that maps
# 1:1 onto the 8760 network snapshots below.
renewable_snapshots:
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  end_inclusive: true

# Full model year (user decision 2026-09-01; supersedes the two-week D5
# window from the master spec).
snapshots:
  start: "2019-01-01 00:00"
  end: "2019-12-31 23:00"
  inclusive: both

# Non-null value hard-required by the godeeep renewable dataset on both
# branches (build_renewable_profiles raises otherwise).
renewable_land_access: reference

# Develop-only: pin GODEEEP CF retrieval to the published Zenodo records so
# both sides read byte-identical inputs. Develop's default registry
# (config.common.yaml) prefers the local Oak mirror, whose 2012 files are NOT
# byte-identical to the Zenodo publication (md5 mismatch at equal size,
# verified 2026-09-01: solar 04035cbc… vs Zenodo 53c13210…, wind a62f2442…
# vs Zenodo 0115963d…). Lists replace wholesale in the config merge, so this
# `sources:` drops the mirror entry. Master never reads this key — its
# ZenodoScenarioDownloader hardcodes the SAME record ids.
godeeep_cf_registry:
  sources:
    - kind: zenodo
      datasets:
        solar_historical_compressed:
          record: 20127513
          years: [2012]
        wind_125m_historical_compressed:
          record: 20127520
          years: [2012]

# Master-required: parse-time read in add_extra_components input ternary.
# Values mirror develop's config.common.yaml defaults.
co2:
  storage: false
  network:
    enable: false
    capital_cost: 2736000
    marginal_cost: 4
    lifetime: 40
    discount_rate: 0.07

electricity:
  # Explicit on develop, where it is the shipped default. Master has no code
  # reading this key at all, so the pin alone could not neutralise HF-3 — the
  # code was ported onto master-benchmark (93665e6) and the pin records the
  # value both sides run. Harness plan decision 2, 2026-09-14.
  honor_planned_retirements: true
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass, waste]
  renewable_carriers: [onwind, solar, hydro]
  retirement: economic
  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT]
    StorageUnit: [4hr_battery_storage]
    Store: []
    Link: []
  demand:
    profile: efs
    # pin the legacy Breakthrough Pd weight: master has no
    # census-population method, so equivalence requires the legacy path
    bus_allocation: breakthrough
    scenario:
      efs_case: reference
      efs_speed: moderate
      aeo: reference
  # Solve-stage policy files, hard-required (direct subscript) by the opts
  # constraint registry on BOTH branches: regional_Co2_limits is read by
  # add_regional_co2limit (opts/policy.py) for the REM opt in this run's
  # opts string; technology_capacity_targets (TCT opt) and
  # portfolio_standards (RPS opt) are the sibling keys read the same way.
  # Paths mirror config.default.yaml; the CSVs ship in
  # repo_data/config/policy_constraints/ in both checkouts.
  # USA harness: single national 1,000,000 t cap (regions='all') instead of the
  # state-policy CSV — the REM-3h run binds it, the 3h run never reads it.
  # build.py syncs this harness-only CSV into the baseline worktree.
  regional_Co2_limits: 'repo_data/config/policy_constraints/regional_Co2_limits_equivalence_usa.csv'
  technology_capacity_targets: 'repo_data/config/policy_constraints/technology_capacity_targets.csv'
  portfolio_standards: 'repo_data/config/policy_constraints/portfolio_standards.csv'

conventional:
  unit_commitment: false
  must_run: false
  dynamic_fuel_price:
    enable: false
    pudl: true
    wholesale: true

lines:
  s_max_pu: 0.7
  s_nom_max: .inf
  max_extension: 20000
  length_factor: 1.25   # routing factor folded into `length` at aggregation; cost-side factor stays 1.0. Only affects TAMU (line-preserving) runs - reeds transport rebuilds ITL costs from ReEDS tables

links:
  p_max_pu: 1.0
  p_nom_max: .inf
  max_extension: 20000

costs:
  ng_fuel_year: 2019
  # Required by build_cost_data on both branches: without it the script falls
  # back to "Reference" (capital R), which matches zero rows in PUDL's
  # model_case_eiaaeo (values are lowercase snake_case) and crashes with an
  # IndexError in build_aeo_fuel_costs. Value mirrors config.default.yaml.
  aeo:
    scenario: reference
  # Hard-required (direct subscript) by add_extra_components (itc/ptc/
  # max_growth, both branches) and prepare_network (emission_prices,
  # social_discount_rate). Values mirror config.default.yaml.
  social_discount_rate: 0.02
  emission_prices:
    enable: false
    co2: 0.
    co2_monthly_prices: false
  ptc_modifier:
    onwind: 27.50
    biomass: 27.50
  itc_modifier:
    solar: 0.3
    offwind: 0.3
    offwind_floating: 0.3
    EGS: 0.3
    geothermal: 0.3
    SMR: 0.3
    nuclear: 0.3
    hydro: 0.3
    2hr_battery_storage: 0.3
    4hr_battery_storage: 0.3
    6hr_battery_storage: 0.3
    8hr_battery_storage: 0.3
    10hr_battery_storage: 0.3
    8hr_PHS: 0.3
    10hr_PHS: 0.3
    12hr_PHS: 0.3
  min_year:
    hydrogen_ct: 2040
  max_growth:

clustering:
  simplify_network:
    algorithm: kmeans
    feature: solar+onwind-time    # master-required key (prong 2); unused by kmeans math
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time    # master-required key; unused by kmeans math
    exclude_carriers: []
    consider_efficiency_classes: false
  aggregation_strategies:
    generators:
      build_year: 'capacity_weighted_average'
      lifetime: 'capacity_weighted_average'
      start_up_cost: 'capacity_weighted_average'
      min_up_time: 'capacity_weighted_average'
      min_down_time: 'capacity_weighted_average'
      ramp_limit_up: max
      ramp_limit_down: max
      committable: any
      vom_cost: mean
      fuel_cost: mean
      heat_rate: mean
  temporal:
    resolution_elec: false
    resolution_sector: false

solving:
  options:
    load_shedding: false
    clip_p_max_pu: 1.e-2
    noisy_costs: true                      # seeded (123) -> deterministic across branches
    skip_iterations: true
    rolling_horizon: false
    seed: 123
    track_iterations: false
    min_iterations: 4
    max_iterations: 6
    transmission_losses: 2
    linearized_unit_commitment: true
    horizon: 8760
    assign_all_duals: true
  solver:
    name: gurobi
    options: gurobi-default
  solver_options:
    gurobi-default:
      threads: 8
      method: 2
      crossover: 0
      BarHomogeneous: 1
      BarConvTol:    1.e-5
      OptimalityTol: 1.e-4
      FeasibilityTol: 1.e-3
      ScaleFlag: 1
      Seed: 123
      AggFill: 0
      PreDual: 0
      # Mirrors config.default.yaml. Required explicitly here: the develop
      # branch now auto-loads config.default.yaml as a base layer, so omitting
      # this would hand develop a solver option master never sees and
      # break the like-for-like comparison.
      GURO_PAR_BARDENSETHRESH: 200

focus_weights:

custom_files:
  activate: false
  files_path: ''
  network_name: ''
