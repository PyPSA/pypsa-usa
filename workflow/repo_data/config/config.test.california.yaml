# PyPSA-USA SERVM test config — used by tests/integration to build the
# CPUC SERVM demand artifacts on a minimal CA-only Western slice.
# DO NOT use as a user-facing entry point; see config.california.yaml
# for the maintained California model.
#
# NOTE ON SNAPSHOTS: unlike config.test.yaml this config keeps a full
# 8760-hour year. `ReadServm._assign_snapshots` maps each SERVM hourly
# strip positionally onto the network's own per-period snapshots and
# raises unless the planning horizon carries exactly 8760 of them, so a
# truncated snapshot window cannot build SERVM demand. Runtime is kept
# down by the small `simpl`/`clusters` values instead.
#
# NOTE ON DATA: building this config downloads one ~118 MB CPUC SERVM
# load file (the 2030 forecast year) from files.cpuc.ca.gov.
run:
  name: "test-california"
  disable_progressbar: true
  shared_resources: false
  shared_cutouts: true
  validation: false

foresight: 'perfect'

scenario:
  interconnect: [western]
  clusters: [4m]
  simpl: [20]
  opts: [REM-3h]
  ll: [v1.0]
  scope: "total"
  sector: ""
  planning_horizons: [2030]   # must be a CPUC SERVM forecast year

model_topology:
  transmission_network: 'reeds'
  topological_boundaries: 'reeds_zone'
  interface_transmission_limits: true
  include:
    reeds_state: ['CA']
  aggregate: {}

enable:
  build_cutout: false

renewable_weather_years: [2019]

snapshots:
  start: "2019-01-01"
  end: "2020-01-01"
  inclusive: "left"

electricity:
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass, waste]
  renewable_carriers: [onwind, solar, hydro]
  retirement: economic
  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT]
    StorageUnit: [4hr_battery_storage]
    Store: []
    Link: []
  transmission_interface_limits: 'config/policy_constraints/transmission_interface_limits.csv'
  demand:
    profile: servm
    bus_allocation: population
    scenario:
      servm_weather_years: [2019]
      aeo: reference
  imports:
    enable: true
    costs: wholesale
    co2_emissions: 0.428
    capacity_limit: true
    volume_limit: 25
    balancing_period: year
  exports:
    enable: true
    costs: wholesale
    capacity_limit: true
    volume_limit: 25
    balancing_period: year

conventional:
  unit_commitment: false
  must_run: false
  dynamic_fuel_price:
    enable: false
    pudl: true
    wholesale: true
  ambient_derate:
    enable: false   # PHASE 2 — raises NotImplementedError when true

lines:
  s_max_pu: 0.7
  s_nom_max: .inf
  max_extension: 20000
  length_factor: 1.25

links:
  p_max_pu: 1.0
  p_nom_max: .inf
  max_extension: 20000

costs:
  ng_fuel_year: 2019

clustering:
  simplify_network:
    algorithm: kmeans
  cluster_network:
    algorithm: kmeans
    exclude_carriers: []
    consider_efficiency_classes: false
  aggregation_strategies:
    generators:
      build_year: 'capacity_weighted_average'
      lifetime: 'capacity_weighted_average'
      start_up_cost: 'capacity_weighted_average'
      min_up_time: 'capacity_weighted_average'
      min_down_time: 'capacity_weighted_average'
      ramp_limit_up: max
      ramp_limit_down: max
      committable: any
      vom_cost: mean
      fuel_cost: mean
      heat_rate: mean
  temporal:
    resolution_elec: false
    resolution_sector: false

focus_weights:

custom_files:
  activate: false
  files_path: ''
  network_name: ''
