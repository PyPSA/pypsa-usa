pudl_path: s3://pudl.catalyst.coop/v2025.5.0

# docs :
renewable:
  EGS:
    dispatch: baseload # baseload or flexible
    drilling_cost: base # base or advanced — selects EGS supply-curve capex column
  onwind:
    cutout: era5
    resource:
      method: wind
      turbine: Vestas_V112_3MW
      add_cutout_windspeed: true
    capacity_per_sqkm: 3 # conservative, ScholzPhd Tab 4.3.1: 10MW/km^2
    correction_factor: 1 # 0.93
    corine:
      #all keys labeled corrine are actually copernicus codes. Using the name corrine bc using the pypsa-eur convention: https://land.copernicus.eu/global/sites/cgls.vito.be/files/products/CGLOPS1_PUM_LC100m-V3_I3.4.pdf
      grid_codes: [20, 30, 40, 60, 100, 111, 112, 113, 114, 115]
      distance: 10 #buffer from distance_grid_codes that are to be excluded
      distance_grid_codes: [50]
    natura: true
    cec: true
    potential: conservative # simple or conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  offwind:
    cutout: era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_2020ATB_5.5MW
      # add_cutout_windspeed: true
    capacity_per_sqkm: 3 # 2021–2022 Transmission Plan, CAISO
    correction_factor: 1 # 0.8855 # proxy for wake losses, from 10.1016/j.energy.2018.08.153
    corine:
      grid_codes: [80, 200] #page 28 of https://land.copernicus.eu/global/sites/cgls.vito.be/files/products/CGLOPS1_PUM_LC100m-V3_I3.4.pdf
    natura: true
    boem_screen: False
    max_depth: 60 # meters, ref https://www.nrel.gov/docs/fy16osti/66599.pdf
    min_shore_distance: 22000 # meters
    max_shore_distance: 65000 # meters
    potential: conservative # simple or conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  offwind_floating:
    cutout: era5
    resource:
      method: wind
      turbine: NREL_ReferenceTurbine_2020ATB_15MW_offshore
      add_cutout_windspeed: true
    capacity_per_sqkm: 3 # 2021–2022 Transmission Plan, CAISO
    correction_factor: 1 # 0.8855 # proxy for wake losses, from 10.1016/j.energy.2018.08.153
    corine:
      grid_codes: [80, 200] #page 28 of https://land.copernicus.eu/global/sites/cgls.vito.be/files/products/CGLOPS1_PUM_LC100m-V3_I3.4.pdf
    natura: true
    boem_screen: true
    min_depth: 60 # meters, ref https://www.nrel.gov/docs/fy16osti/66599.pdf
    max_depth: 1300 # meters, ref https://www.nrel.gov/docs/fy22osti/83650.pdf
    min_shore_distance: 22000 # meters
    max_shore_distance: 65000 # meters
    potential: conservative # simple or conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  solar:
    cutout: era5
    resource:
      method: pv
      panel: CSi
      orientation: latitude_optimal # will lead into optimal
    capacity_per_sqkm: 4.6 # From 1.7 to 4.6 addresses issue #361 - TODO revisit this assumption
    correction_factor: 1 # 0.854337
    corine:
      grid_codes: [20, 30, 60, 90, 100] #see above for codes
    natura: true
    cec: true
    potential: conservative # simple or conservative
    clip_p_max_pu: 1.e-2
    extendable: true
  hydro:
    cutout: era5
    carriers: [ror, PHS, hydro]
    resource:
      method: hydro
    extendable: true


# docs :
## NREL land-access exclusion settings for the GODEEEP workflow.
## When renewable.dataset == "godeeep", `renewable_land_access` is REQUIRED and the
## workflow downloads `data/nrel_exclusion/derived/{avail,caps}_*.nc` from Zenodo
## to apply per-cell availability weighting and NREL supply-curve capacities.
renewable_land_access:                # required for godeeep: reference | limited | open
apply_cec_basescreen: false           # overlay CEC Wind/Solar BaseScreen on onwind+solar (CA-only)
apply_boem_osw: false                 # overlay BOEM OSW planning areas on offwind+offwind_floating
godeeep_wind_height: "_100m"          # raw GODEEEP wind-CF hub height (e.g. "_100m", "_125m")


# docs :
atlite:
  nprocesses: 8
  show_progress: false # false saves time
  cutouts:
    era5_2019:
      module: era5 # in priority order
      time: ['2019', '2019']
  interconnects:
    western:
      x: [-126, -99]
      y: [27, 50]
      dx: 0.3
      dy: 0.3
    eastern:
      x: [-109, -65]
      y: [23, 50]
      dx: 0.3
      dy: 0.3
    texas:
      x: [-110, -90]
      y: [24, 37]
      dx: 0.3
      dy: 0.3
    usa:
      x: [-126, -65]
      y: [23, 50]
      dx: 0.3
      dy: 0.3

 
lines:
  types: #Temp values, replaced.
    115.: "Al/St 240/40 2-bundle 220.0"
    138.: "Al/St 240/40 2-bundle 220.0"
    161.: "Al/St 240/40 2-bundle 220.0"
    230.: "Al/St 240/40 2-bundle 220.0"
    345.: "Al/St 240/40 4-bundle 380.0"
    500.: "Al/St 560/50 4-bundle 750.0"
    765.: "Al/St 560/50 4-bundle 750.0"
 

offshore_shape:
  use: eez #options are ca_osw, eez

offshore_network:
  bus_spacing: 25000 # km

# docs :
# Defaults for the CO2 storage / pipeline-network optionality. Per-scenario
# configs override; keeping the keys defined here ensures every rule that
# reads ``config["co2"][...]`` resolves even when a config does not opt in.
co2:
  storage: false   # [false, true]
  network:
    enable: false   # [false, true]
    capital_cost: 2736000   # in USD/12-inch diameter/mile
    marginal_cost: 4   # in USD/tCO2
    lifetime: 40   # in years
    discount_rate: 0.07

# docs :
# UCAP (Unforced Capacity) calculation based on Forced Outage Rates (FOR)
# UCAP = ICAP * (1 - FOR), applied as p_max_pu = 1 - FOR for conventional generators
ucap:
  enable: false  # [false, true]
  forced_outage_rates:  # Forced outage rates in percent
    coal: 11.061
    oil: 11.061
    hydro: 8.127
    CCGT: 6.107
    nuclear: 2.207
    OCGT: 6.259
