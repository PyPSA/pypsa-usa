# ====================================================================
# PyPSA-USA — Tutorial Configuration (minimal smoke-test run)
# ====================================================================
# California-only, 4-cluster, single 2050 horizon — the smallest
# meaningful end-to-end run. Use this to confirm a fresh checkout can
# build, cluster, and solve a network.
#
# Audience: new users verifying their install. Run with:
#   cd workflow
#   uv run snakemake -j1 --configfile repo_data/config/config.tutorial.yaml
#
# This is a SPARSE OVERLAY. `workflow/Snakefile` already loads the
# layered base (config.cluster / config.common / config.plotting /
# config.api / config.sector / config.default) underneath it, so only
# keys that DIFFER from that merged base belong here. Everything not
# listed — solver options, costs, clustering strategies, lines/links,
# conventional generators, CO2, DAC — comes from config.default.yaml.
#
# NB: lists are REPLACED wholesale by the merge, never merged element-
# wise, so any list that differs must be restated in full.
#
# Option reference: docs/source/config-configuration.md
# ====================================================================

# ====================================================================
# RUN — run identity
# ====================================================================
run:
  name: "Tutorial"                       # resources/<name>/ subdir for this run


# ====================================================================
# SCENARIO — workflow wildcards and planning horizons
# ====================================================================
scenario:
  interconnect: [western]                # pinned: the tutorial is a CA slice of the Western Interconnect
  planning_horizons: [2050]              # single horizon keeps the solve small
  clusters: [4m]                         # 4 clusters, m = memory-scaled resource hint
  scope: "total"                         # demand scope; urban | rural | total


# ====================================================================
# MODEL TOPOLOGY — restrict the footprint to California
# ====================================================================
model_topology:
  include:
    reeds_state: ['CA']                  # restrict the network to California REeDS zones


# ====================================================================
# ELECTRICITY — expansion candidates
# ====================================================================
# Same as config.default.yaml minus `hydrogen_ct` (whose `costs.min_year`
# of 2040 makes it irrelevant to this single-horizon tutorial).
electricity:
  extendable_carriers:
    Generator: [solar, onwind, offwind_floating, OCGT, CCGT, CCGT-95CCS, coal, nuclear]


# ====================================================================
# SECTOR — sector-coupling settings (inert while scenario.sector is "")
# ====================================================================
# Kept as a worked example of the sector knobs a coupled run needs; the
# remaining sector defaults come from config.sector.yaml.
sector:
  co2_sequestration_potential: 0         # tCO2/yr nationwide sequestration cap
  natural_gas:
    cyclic_storage: false                # false = do not enforce SOC continuity at the year boundary
  demand:
    profile:                             # demand profile source per end-use
      residential: eulp                  # efs (EIA-EFS) | eulp (NREL ResStock/ComStock End-Use Load Profiles)
      commercial:  eulp                  # efs | eulp
      transport:   efs                   # efs
      industry:    efs                   # efs
    scale:                               # forward-scaling source per end-use
      residential: aeo                   # efs | aeo (EIA Annual Energy Outlook)
      commercial:  aeo
      transport:   aeo
      industry:    aeo
    disaggregation:                      # how to split state-level demand to nodes
      residential: pop                   # pop = population-weighted
      commercial:  pop
      transport:   pop
      industry:    pop
    scenarios:
      aeo: reference                     # AEO scenario; reference | high | low


# ====================================================================
# SOLVING — scheduler memory hint (solver settings come from the base)
# ====================================================================
solving:
  mem: 30000                             # MB of RAM hint for the SLURM scheduler
