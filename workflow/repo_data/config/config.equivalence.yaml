# PyPSA-USA equivalence-harness config — Tier C (see
# docs/superpowers/specs/2026-08-07-pipeline-equivalence-and-perf-design.md).
# One shared file drives BOTH the v1-epic candidate and the anchor
# (upstream/develop e7f8bd70) baseline builds. The harness driver passes
# explicit target paths, so scenario lists here document the run shape;
# wildcards are taken from the targets. DO NOT use as a user-facing entry.
#
# Keys the ANCHOR requires from the main config (its layered common lacks
# them): co2.storage, clustering.cluster_network.feature,
# clustering.simplify_network.feature (prong 2). v1-epic ignores the extras.
run:
  name: "equivalence"
  disable_progressbar: true
  shared_resources: false
  shared_cutouts: true
  validation: false

foresight: 'perfect'

scenario:
  interconnect: [western]
  clusters: [10]
  simpl: ['']            # prong 1 (pass-through); prong 2 targets use s20
  opts: [REM-3h]
  ll: [v1.0]
  scope: "total"
  sector: ""
  planning_horizons: [2030]

model_topology:
  transmission_network: 'reeds'
  topological_boundaries: 'reeds_zone'
  interface_transmission_limits: false
  include:
    reeds_state: ['CA']
  aggregate: {}

enable:
  build_cutout: false

renewable_weather_years: [2019]

# Two full Sun-Sat January weeks (D5 in the master spec).
snapshots:
  start: "2019-01-06 00:00"
  end: "2019-01-19 23:00"
  inclusive: both

# Non-null value hard-required by the godeeep renewable dataset on both
# branches (build_renewable_profiles raises otherwise).
renewable_land_access: reference

# Anchor-required: parse-time read in add_extra_components input ternary.
# Values mirror v1-epic's config.common.yaml defaults.
co2:
  storage: false
  network:
    enable: false
    capital_cost: 2736000
    marginal_cost: 4
    lifetime: 40
    discount_rate: 0.07

electricity:
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass, waste]
  renewable_carriers: [onwind, solar, hydro]
  retirement: economic
  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT]
    StorageUnit: [4hr_battery_storage]
    Store: []
    Link: []
  demand:
    profile: efs
    scenario:
      efs_case: reference
      efs_speed: moderate
      aeo: reference

conventional:
  unit_commitment: false
  must_run: false
  dynamic_fuel_price:
    enable: false
    pudl: true
    wholesale: true

lines:
  s_max_pu: 0.7
  s_nom_max: .inf
  max_extension: 20000
  length_factor: 1.25

links:
  p_max_pu: 1.0
  p_nom_max: .inf
  max_extension: 20000

costs:
  ng_fuel_year: 2019

clustering:
  simplify_network:
    algorithm: kmeans
    feature: solar+onwind-time    # anchor-required key (prong 2); unused by kmeans math
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time    # anchor-required key; unused by kmeans math
    exclude_carriers: []
    consider_efficiency_classes: false
  aggregation_strategies:
    generators:
      build_year: 'capacity_weighted_average'
      lifetime: 'capacity_weighted_average'
      start_up_cost: 'capacity_weighted_average'
      min_up_time: 'capacity_weighted_average'
      min_down_time: 'capacity_weighted_average'
      ramp_limit_up: max
      ramp_limit_down: max
      committable: any
      vom_cost: mean
      fuel_cost: mean
      heat_rate: mean
  temporal:
    resolution_elec: false
    resolution_sector: false

solving:
  options:
    load_shedding: false
    clip_p_max_pu: 1.e-2
    noisy_costs: true                      # seeded (123) -> deterministic across branches
    skip_iterations: true
    rolling_horizon: false
    seed: 123
    track_iterations: false
    min_iterations: 4
    max_iterations: 6
    transmission_losses: 2
    linearized_unit_commitment: true
    horizon: 8760
    assign_all_duals: true
  solver:
    name: gurobi
    options: gurobi-default
  solver_options:
    gurobi-default:
      threads: 8
      method: 2
      crossover: 0
      BarHomogeneous: 1
      BarConvTol:    1.e-5
      OptimalityTol: 1.e-4
      FeasibilityTol: 1.e-3
      ScaleFlag: 1
      Seed: 123
      AggFill: 0
      PreDual: 0

focus_weights:

custom_files:
  activate: false
  files_path: ''
  network_name: ''
