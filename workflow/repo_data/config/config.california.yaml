# ====================================================================
# PyPSA-USA — California Configuration (CPUC SERVM demand)
# ====================================================================
# A maintained, runnable California-only capacity-expansion model.
#
# What it is:
#   * Footprint  : the four California REeDS zones (p8, p9, p10, p11),
#                  carved out of the Western Interconnection.
#   * Demand     : CPUC SERVM 2026 IRP hourly load for the six California
#                  load regions (IID, LADWP, NCNC, PGE, SCE, SDGE),
#                  disaggregated onto buses with the population-derived
#                  SERVM allocation weights (`build_servm_load_weights`).
#   * Trade      : imports/exports to the rest of WECC are enabled and
#                  capped in aggregate by the RESOLVE CAISO interface
#                  limits (`model_topology.interface_transmission_limits`).
#   * Horizons   : 2030 / 2035 / 2040 / 2045, solved with perfect foresight.
#
# How to run it:
#   cd workflow
#   uv run snakemake -j1 --configfile config/config.california.yaml
#   # data model only (no solve):
#   uv run snakemake data_model -j1 --configfile config/config.california.yaml
#
# The `retrieve_cpuc_servm_load` rule pulls one ~118 MB CSV per planning
# horizon from files.cpuc.ca.gov the first time this config is built.
#
# Option reference:   docs/source/config-configuration.md
# Demand reference:   docs/source/data-demand.md  (SERVM section)
# Spatial reference:  docs/source/config-spatial.md
# ====================================================================


# ====================================================================
# RUN — run identity and shared-resource toggles
# ====================================================================
run:
  name: "california"              # resources/california/ and results/california/
  disable_progressbar: false
  shared_resources: false         # isolate resources per run.name
  shared_cutouts: true            # cutouts are large; share them across runs
  validation: false
  # Marks this run as a CPUC benchmark case. The rule that consumes the flag
  # (comparison of model output against the CPUC SERVM/RESOLVE reference case)
  # lands in a separate PR; the key is inert until then and is safe to leave on.
  benchmark_cpuc: true
  # 2026 is the fleet-vs-fleet comparison (all existing plants, no forecast
  # ambiguity); the CPUC list is a baseline and stays ~static at later years.
  benchmark_cpuc_horizons: [2026]


# ====================================================================
# RENEWABLE DATASET — capacity-factor source for wind & solar
# ====================================================================
renewable:
  dataset: godeeep                # atlite | godeeep


# ====================================================================
# SCENARIO — workflow wildcards and planning horizons
# ====================================================================
# planning_horizons MUST be drawn from the nine CPUC SERVM forecast years
# {2026, 2028, 2030, 2032, 2035, 2037, 2040, 2042, 2045}; any other year
# raises in `ReadServm`. One SERVM load file is downloaded per horizon.
scenario:
  interconnect: [western]                     # CA is carved out of the Western Interconnection
  planning_horizons: [2030, 2035, 2040, 2045] # SERVM forecast years only
  clusters: [4]                               # p8, p9, p10, p11 — the four CA REeDS zones
  simpl: [75]                                 # resource resolution before transmission clustering
  ll: [v1.0]                                  # line-limit scenario; today's transfer capacity
  opts: [REM-3h]                              # REM = regional CO2 limits, 3h = 3-hour resolution
  scope: "total"                              # urban | rural | total
  sector: ""                                  # electricity-only

foresight: 'perfect'                          # all horizons solved in one monolithic problem


# ====================================================================
# MODEL TOPOLOGY — transmission backbone and zonal aggregation
# ====================================================================
# `clusters` is pinned to 4 because the ReEDS zonal backbone cannot be
# clustered below the number of zones in the footprint, and California
# holds exactly four (p8, p9, p10, p11).
model_topology:
  transmission_network: 'reeds'          # ReEDS/NARIS zonal backbone
  topological_boundaries: 'reeds_zone'   # county | reeds_zone | state
  interface_transmission_limits: true    # apply the RESOLVE CAISO interface caps
  include:
    reeds_state: ['CA']                  # equivalent to reeds_zone: ['p8','p9','p10','p11']
  aggregate: {}

# --------------------------------------------------------------------
# ALTERNATIVE: county-resolution California
# --------------------------------------------------------------------
# To run California at county resolution instead of REeDS-zone resolution,
# replace the `scenario` and `model_topology` values above with the block
# below. California has 58 counties, so `clusters` must be 58 — the county
# NARIS interface table (transmission_capacity_init_AC_county_NARIS2024.csv)
# carries exactly 58 `p06xxx` nodes. `simpl: ['county']` uses the county-FIPS
# fast path in `cluster_simpl` so the resource layer is built directly on
# county boundaries; a numeric `simpl` >= 58 also works if you want more
# resource zones than transmission nodes.
#
# `add_extra_components` swaps to the county NARIS flowgate file automatically
# when `topological_boundaries: 'county'` — no other key needs changing.
#
#   scenario:
#     interconnect: [western]
#     planning_horizons: [2030, 2035, 2040, 2045]
#     clusters: [58]                     # 58 California counties
#     simpl: ['county']                  # county-FIPS fast path in cluster_simpl
#     ll: [v1.0]
#     opts: [REM-3h]
#     scope: "total"
#     sector: ""
#
#   model_topology:
#     transmission_network: 'reeds'
#     topological_boundaries: 'county'
#     interface_transmission_limits: true
#     include:
#       reeds_state: ['CA']
#     aggregate: {}
#
# See docs/source/config-spatial.md for the county workflow and the
# minimum-cluster table.
# --------------------------------------------------------------------


# ====================================================================
# ENABLE — top-level feature flags
# ====================================================================
enable:
  build_cutout: false                    # consume the prebuilt atlite cutout


# ====================================================================
# SNAPSHOTS & WEATHER YEARS — temporal scope
# ====================================================================
# `renewable_weather_years` and `electricity.demand.scenario.servm_weather_years`
# are deliberately the same year: SERVM publishes 25 stacked weather years
# (2000-2024) per forecast year, and drawing load and renewable profiles from
# different weather years decorrelates load from wind/solar. A mismatch is
# allowed but logs a warning in `build_electrical_demand`.
renewable_weather_years: [2019]

snapshots:
  start: "2019-01-01"
  end: "2020-01-01"
  inclusive: "left"                      # a full 8760-hour year

renewable_scenarios: ["rcp85cooler"]     # GODEEEP climate scenario

renewable_snapshots:
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  end_inclusive: true


# ====================================================================
# ELECTRICITY — generators, storage, demand, reserves, trade
# ====================================================================
electricity:
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass, waste]
  renewable_carriers:   [onwind, offwind_floating, solar, hydro]
  retirement: economic

  extendable_carriers:
    Generator:    [solar, onwind, offwind_floating, OCGT, CCGT, CCGT-95CCS, nuclear, hydrogen_ct]
    StorageUnit:  [4hr_battery_storage, 8hr_battery_storage]
    Store: []
    Link:  []

  # ---------------- Reserves & resource adequacy ----------------
  SAFE_reservemargin: 0.14
  SAFE_regional_reservemargins:   'config/policy_constraints/SAFE_regional_prm.csv'

  operational_reserve:
    activate: false
    epsilon_load: 0.02
    epsilon_vres:  0.02
    contingency: 4000

  erm:
    all: 0.15

  # ---------------- Policy & emissions ----------------
  regional_Co2_limits:            'config/policy_constraints/regional_Co2_limits.csv'
  technology_capacity_targets:    'config/policy_constraints/technology_capacity_targets.csv'
  portfolio_standards:            'config/policy_constraints/portfolio_standards.csv'
  # Aggregate MW caps on the CAISO import/export interfaces (RESOLVE), applied
  # when model_topology.interface_transmission_limits is true.
  transmission_interface_limits:  'config/policy_constraints/transmission_interface_limits.csv'

  # ---------------- Demand ----------------
  demand:
    profile: servm                       # CPUC SERVM 2026 IRP hourly load (California only)
    bus_allocation: population           # 2020 Census county populations
    scenario:
      # Weather year drawn from the stacked 2000-2024 SERVM record. Exactly one
      # entry: multiple entries are reserved for stochastic scenarios (phase 3)
      # and currently raise NotImplementedError.
      servm_weather_years: [2019]
      aeo: reference                     # unused by SERVM (one file per forecast year)

  demand_response:
    shift: 0
    marginal_cost: 999999

  # ---------------- Inter-regional trade ----------------
  # California is not an island: the rest of WECC is represented as virtual
  # import/export links whose aggregate flow is capped by the RESOLVE CAISO
  # interfaces above. `volume_limit: 25` caps annual imported/exported energy
  # at 25% of total demand, roughly CAISO's historical net-import share.
  imports:
    enable: true
    costs: wholesale                     # priced at monthly wholesale hub prices
    co2_emissions: 0.428                 # tCO2/MWh assigned to imported energy
    capacity_limit: true                 # cap import power at historical maxima
    volume_limit: 25                     # % of total demand per balancing period
    balancing_period: year

  exports:
    enable: true
    costs: wholesale
    capacity_limit: true
    volume_limit: 25
    balancing_period: year


# ====================================================================
# CONVENTIONAL — unit-commitment and fuel-price overrides
# ====================================================================
conventional:
  unit_commitment: false
  must_run: false
  dynamic_fuel_price:
    enable: false
    pudl: true
    wholesale: true

  # ---- PHASE 2 (NOT IMPLEMENTED) ----------------------------------
  # Ambient-temperature capacity derates for thermal units, taken from the
  # CPUC SERVM unit-specific hourly derate profiles. `enable: true` currently
  # raises NotImplementedError in add_electricity — the CPUC derate profiles
  # are not retrieved or applied yet (see the reserved
  # `retrieve_cpuc_thermal_derate` rule in workflow/rules/retrieve.smk).
  #
  # When it lands it REPLACES the EIA-860 summer/winter seasonal derate
  # (`replaces_seasonal_derate: true`) rather than stacking on top of it.
  # Stacking an ambient derate on a seasonal derate, or on a UCAP-derated
  # capacity credit, double-counts the same thermal deficiency and must never
  # be done.
  ambient_derate:
    enable: false                        # PHASE 2 — leave false
    source: cpuc_servm                   # CPUC SERVM unit-specific hourly derates
    replaces_seasonal_derate: true       # never stack with the EIA-860 seasonal derate


# ====================================================================
# LINES — AC transmission lines
# ====================================================================
lines:
  s_max_pu: 0.7
  s_nom_max: .inf
  max_extension: 20000
  length_factor: 1.25


# ====================================================================
# LINKS — HVDC and controllable links
# ====================================================================
links:
  p_max_pu: 1.0
  p_nom_max: .inf
  max_extension: 20000


# ====================================================================
# CO2 — sequestration storage and pipeline transport
# ====================================================================
co2:
  storage: false
  network:
    enable: false
    capital_cost:  2736000
    marginal_cost: 4
    lifetime: 40
    discount_rate: 0.07


# ====================================================================
# DAC — Direct Air Capture
# ====================================================================
dac:
  enable: false
  granularity: "node"
  capital_cost: 6000000
  electricity_input: 2.5
  lifetime: 20
  discount_rate: 0.07


# ====================================================================
# COSTS — capex/opex scenarios and policy incentives
# ====================================================================
costs:
  atb:
    model_case: "Market"
    scenario:   "Moderate"
    overrides:

  aeo:
    scenario: "reference"

  social_discount_rate: 0.02
  ng_fuel_year: 2019                     # CAISO NG price vintage year

  emission_prices:
    enable: false
    co2: 0.
    co2_monthly_prices: false

  ptc_modifier:
    onwind: 27.50
    biomass: 27.50

  itc_modifier:
    solar: 0.3
    offwind: 0.3
    offwind_floating: 0.3
    EGS: 0.3
    geothermal: 0.3
    SMR: 0.3
    nuclear: 0.3
    hydro: 0.3
    2hr_battery_storage:  0.3
    4hr_battery_storage:  0.3
    6hr_battery_storage:  0.3
    8hr_battery_storage:  0.3
    10hr_battery_storage: 0.3
    8hr_PHS:  0.3
    10hr_PHS: 0.3
    12hr_PHS: 0.3

  min_year:
    hydrogen_ct: 2040
  max_growth:


# ====================================================================
# CLUSTERING — pre-cluster (simpl) and final (cluster) settings
# ====================================================================
clustering:
  simplify_network:
    weighting_strategy: demand-capacity
    algorithm: kmeans
  cluster_network:
    weighting_strategy: demand-capacity
    algorithm: kmeans
    exclude_carriers: []
    consider_efficiency_classes: false

  aggregation_strategies:
    generators:
      build_year:      'capacity_weighted_average'
      lifetime:        'capacity_weighted_average'
      start_up_cost:   'capacity_weighted_average'
      min_up_time:     'capacity_weighted_average'
      min_down_time:   'capacity_weighted_average'
      ramp_limit_up:   max
      ramp_limit_down: max
      committable:     any
      vom_cost:        mean
      fuel_cost:       mean
      heat_rate:       mean

  temporal:
    resolution_elec:   false             # the 3h in `opts` does the temporal reduction
    resolution_sector: false

focus_weights:


# ====================================================================
# SOLVING — solver selection, options, and per-solver tunings
# ====================================================================
solving:
  options:
    load_shedding: false
    clip_p_max_pu: 1.e-2
    noisy_costs: true
    skip_iterations: true
    rolling_horizon: false
    seed: 123
    track_iterations: false
    min_iterations: 4
    max_iterations: 6
    transmission_losses: 2
    linearized_unit_commitment: true
    horizon: 8760
    assign_all_duals: true

  solver:
    name: gurobi
    options: gurobi-default

  solver_options:
    highs-default:
      # https://ergo-code.github.io/HiGHS/options/definitions.html
      threads: 4
      solver: "ipm"
      run_crossover: "off"
      small_matrix_value: 1e-6
      large_matrix_value: 1e9
      primal_feasibility_tolerance: 1e-5
      dual_feasibility_tolerance:   1e-5
      ipm_optimality_tolerance:     1e-4
      parallel: "on"
      random_seed: 123
    gurobi-default:
      threads: 8
      method: 2
      crossover: 0
      BarHomogeneous: 1
      BarConvTol:    1.e-5
      OptimalityTol: 1.e-4
      FeasibilityTol: 1.e-3
      ScaleFlag: 1
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
    gurobi-numeric-focus:
      name: gurobi
      NumericFocus: 3
      method: 2
      crossover: 0
      BarHomogeneous: 1
      BarConvTol:    1.e-5
      FeasibilityTol: 1.e-4
      OptimalityTol:  1.e-4
      ObjScale: -0.5
      threads: 8
      Seed: 123
    gurobi-fallback:
      name: gurobi
      crossover: 0
      method: 2
      BarHomogeneous: 1
      BarConvTol:    1.e-5
      FeasibilityTol: 1.e-5
      OptimalityTol:  1.e-5
      Seed: 123
      threads: 8
    cplex-default:
      threads: 4
      lpmethod: 4
      solutiontype: 2
      barrier.convergetol: 1.e-5
      feasopt.tolerance:   1.e-6
    cbc-default: {}
    glpk-default: {}

  mem: 30000
  walltime: "12:00:00"


# ====================================================================
# WALLTIME — per-rule HPC walltime overrides (only used by SLURM driver)
# ====================================================================
walltime:
  build_renewable_profiles: '04:00:00'
  build_fuel_prices:        '00:20:00'
  add_demand:               '02:00:00'
  add_electricity:          '04:00:00'
  aggregate_to_substations: '02:00:00'
  cluster_resources:        '05:00:00'
  cluster_network:          '04:00:00'
  solve_network:            '20:00:00'


# ====================================================================
# CUSTOM FILES — bring-your-own network or costs
# ====================================================================
custom_files:
  activate: false
  files_path: ''
  network_name: ''

# REQUIRED for the godeeep renewable dataset (one of: reference | limited | open).
renewable_land_access: reference
