# Kept deliberately small: ruff owns linting, formatting, import sorting and
# pyupgrade-style rewrites (pyproject.toml [tool.ruff]); snakefmt owns Snakefiles.
# The same checks run in CI (.github/workflows/main.yml, fast-tests job), so a
# green pre-commit run locally means a green lint step there.
#
# Removed 2026-09-28 and why:
#   add-trailing-comma  – fought ruff-format (each rewrote the other's output)
#   pyupgrade           – redundant with ruff's UP rules, and pinned py39 vs py311
#   blackdoc            – crashed on non-Python snippets inside docstrings
#   pretty-format-yaml  – rewrote unquoted git shas such as 51e1719 as `.inf`
#   jupyter-notebook-cleanup – no notebooks are linted; kept out to stay small

exclude: "LICENSE*|repo_data/"

ci:
  # Never push autofix commits into contributors' branches; report only.
  autofix_prs: false
  autoupdate_schedule: quarterly

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: debug-statements
  - id: check-yaml
  - id: check-added-large-files
    args: ['--maxkb=10000']

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10   # keep in step with RUFF_VERSION in .github/workflows/main.yml
  hooks:
  - id: ruff-check
    args: ["--config=pyproject.toml", "--fix"]
  - id: ruff-format
    args: ["--config=pyproject.toml"]

- repo: https://github.com/snakemake/snakefmt
  rev: v2.0.3
  hooks:
  - id: snakefmt
