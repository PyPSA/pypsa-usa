# Keeps the SHA-pinned GitHub Actions in .github/workflows current, one
# grouped PR a month. Python dependencies are pinned by hand in
# pyproject.toml and workflow/envs/environment.yaml and are not covered here.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns: ["*"]
